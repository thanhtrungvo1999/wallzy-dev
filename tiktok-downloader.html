<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>Wallzy TikTok Tools</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-in{animation:fadeIn .3s ease-out forwards}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.025),rgba(255,255,255,.08),rgba(255,255,255,.025));background-size:220% 100%;animation:shimmer 1.5s infinite}
.wallzy-card{transform:translateZ(0);transition:transform 220ms cubic-bezier(.2,.8,.2,1),border-color 220ms ease,box-shadow 220ms ease}
.wallzy-card:active{transform:scale(.985)}
input{font-family:inherit}
button,a{ -webkit-tap-highlight-color:transparent}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;z-index:3000;background:#121215;border:1px solid rgba(255,255,255,.12);padding:10px 15px;border-radius:999px;font-size:11px;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ad-frame{width:300px;height:250px;border:1px solid rgba(255,255,255,.1);background:#0a0a0c;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#downloadAdModal{background:rgba(0,0,0,.86);backdrop-filter:blur(16px)}
#downloadAdModal.hidden{display:none}
#downloadAdCard{width:326px;max-width:92vw;background:#0a0a0c;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:12px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
@media(min-width:640px){#app{height:92vh!important;border:8px solid #1c1c1e;border-radius:40px}}
</style>
</head>
<body>
<div id="app" class="w-full max-w-md h-screen mx-auto overflow-hidden flex flex-col relative bg-black shadow-2xl">

<header class="absolute top-0 left-0 right-0 z-40 bg-black/90 backdrop-blur-xl px-5 py-3.5 flex justify-between items-center border-b border-white/10">
  <div class="flex items-center space-x-2"><span class="font-bold text-lg tracking-tight text-white">Wallzy DB.</span></div>
  <div class="flex items-center space-x-2">
    <a href="/" class="w-9 h-9 rounded-full bg-[#121215] border border-white/10 flex items-center justify-center text-gray-200" title="Home"><i class="fa-solid fa-house text-xs"></i></a>
  </div>
</header>

<div class="absolute top-[61px] left-0 right-0 z-[35] bg-black/90 backdrop-blur-xl px-5 pt-3 pb-3 border-b border-white/5">
  <div class="relative flex items-center">
    <i class="fa-solid fa-link absolute left-3.5 text-gray-400 text-xs pointer-events-none"></i>
    <input id="url" type="text" inputmode="url" autocomplete="off" placeholder="Paste TikTok link..." class="w-full bg-[#0a0a0c] border border-white/10 rounded-2xl py-2.5 pl-10 pr-10 text-[16px] text-white placeholder-gray-500 focus:outline-none focus:border-white/30 transition">
    <button id="paste" class="absolute right-2 w-8 h-8 rounded-xl text-gray-400 hover:text-white" title="Paste"><i class="fa-regular fa-clipboard text-xs"></i></button>
  </div>
  <button id="get" class="w-full mt-2 bg-white text-black font-semibold py-2.5 rounded-2xl text-xs shadow active:scale-[.98] transition">Get Photos</button>
</div>

<main id="scroll" class="flex-1 px-5 pt-[164px] pb-32 overflow-y-auto scrollbar-none">
  <div id="status" class="text-center text-[11px] text-gray-500 min-h-5 mb-2"></div>
  <div id="empty" class="hidden">
    <div id="skeletonGrid" class="grid grid-cols-2 gap-3.5">
      <div class="relative rounded-3xl overflow-hidden aspect-[9/16] shadow-sm skeleton border border-white/5"></div><div class="relative rounded-3xl overflow-hidden aspect-[9/16] shadow-sm skeleton border border-white/5"></div><div class="relative rounded-3xl overflow-hidden aspect-[9/16] shadow-sm skeleton border border-white/5"></div><div class="relative rounded-3xl overflow-hidden aspect-[9/16] shadow-sm skeleton border border-white/5"></div><div class="relative rounded-3xl overflow-hidden aspect-[9/16] shadow-sm skeleton border border-white/5"></div><div class="relative rounded-3xl overflow-hidden aspect-[9/16] shadow-sm skeleton border border-white/5"></div>
    </div>
  </div>
  <div id="emptyState" class="py-20 text-center">
    <div class="w-16 h-16 mx-auto rounded-3xl bg-[#0a0a0c] border border-white/10 flex items-center justify-center mb-4"><i class="fa-brands fa-tiktok text-2xl text-white/70"></i></div>
    <div class="text-xs font-semibold text-white">TikTok Photo Downloader</div>
    <div class="text-[10px] text-gray-500 mt-2 leading-5">Dán link TikTok photo để lấy ảnh gốc không logo.</div>
  </div>
  <div id="result" class="hidden">
    <div class="w-full flex justify-center items-center overflow-hidden mb-3">
      <div class="w-[320px] h-[50px] max-w-full rounded-xl border border-white/10 bg-[#0a0a0c] shadow-lg overflow-hidden flex items-center justify-center">
        <div id="topAdSlot" class="w-[320px] h-[50px] flex items-center justify-center overflow-hidden"></div>
      </div>
    </div>
    <div id="profile" class="flex items-center gap-3 mb-3"></div>
    <div id="photoGrid" class="grid grid-cols-2 gap-3.5"></div>
    <div class="w-full flex justify-center items-center py-3">
      <div class="ad-frame"><div id="gridAdSlot" class="w-[300px] h-[250px] flex items-center justify-center"></div></div>
    </div>
    <button id="downloadAll" class="w-full py-3 bg-white text-black rounded-2xl text-xs font-semibold shadow active:scale-[.98] transition"><i class="fa-solid fa-download mr-1.5"></i>Download All Photos</button>
  </div>
</main>

<footer class="absolute bottom-12 inset-x-6 bg-[#0a0a0c]/90 backdrop-blur-xl border border-white/10 py-2.5 px-6 flex justify-around items-center z-30 rounded-full shadow-2xl">
  <a href="/" class="flex flex-col items-center space-y-0.5 text-white"><i class="fa-regular fa-compass text-xs"></i><span class="text-[9px] font-semibold">Explore</span></a>
  <div class="w-px h-4 bg-white/10"></div>
  <a href="/" class="flex flex-col items-center space-y-0.5 text-gray-400"><i class="fa-regular fa-heart text-xs"></i><span class="text-[9px] font-semibold">Favorites</span></a>
  <div class="w-px h-4 bg-white/10"></div>
  <div class="flex flex-col items-center space-y-0.5 text-white"><i class="fa-brands fa-tiktok text-xs"></i><span class="text-[9px] font-semibold">TikTok</span></div>
</footer>
</div>

<div id="toast"></div>

<div id="downloadAdModal" class="fixed inset-0 z-[1500] hidden flex items-center justify-center p-5">
  <div id="downloadAdCard">
    <div class="flex items-center justify-between px-1 pb-2"><span class="text-[10px] uppercase tracking-widest text-white/45">Advertisement</span><span id="countdown" class="text-[10px] font-semibold text-white/70">5s</span></div>
    <div id="adModalSlot" class="w-[300px] max-w-full h-[250px] mx-auto flex items-center justify-center overflow-hidden rounded-2xl"></div>
    <div class="text-center pt-3 pb-1 text-[10px] leading-4 text-white/40">To keep the website running, please watch the advertisement.</div>
    <div id="waiting" class="text-center pt-1 pb-1 text-[10px] text-white/40">Please wait...</div>
    <button id="skip" class="hidden w-full mt-2 bg-white text-black font-semibold py-3 rounded-2xl text-[11px] uppercase tracking-wider active:scale-[.98] transition">Bỏ qua quảng cáo</button>
  </div>
</div>

<script>
const API='https://www.tikwm.com/api/';const $=id=>document.getElementById(id);let photos=[];let pending=-1;let timer=null;let ready=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function pick(o,...keys){for(const k of keys){if(o?.[k])return o[k]}return ''}
function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function loadAd(id,w,h,body){const c=$(id);if(!c)return;c.innerHTML='';const f=document.createElement('iframe');f.sandbox='allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox';f.style.width=w;f.style.height=h;f.style.border='0';f.scrolling='no';f.title='Advertisement';f.srcdoc='<!doctype html><html><body style="margin:0;overflow:hidden;background:transparent">'+body+'</body></html>';c.appendChild(f)}
$('paste').onclick=async()=>{try{$('url').value=await navigator.clipboard.readText();$('url').focus()}catch(e){showToast('Hãy dán link thủ công.')}};
function valid(u){return /^(https?:\/\/)?((www|m|vm|vt)\.)?tiktok\.com\//i.test(u)}
async function getPhotos(){
 const u=$('url').value.trim();if(!valid(u)){showToast('Link TikTok không hợp lệ');return}
 $('get').disabled=true;$('emptyState').classList.add('hidden');$('result').classList.add('hidden');$('empty').classList.remove('hidden');$('status').innerHTML='<i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Đang lấy ảnh...';
 try{
  const res=await fetch(API+'?url='+encodeURIComponent(u)+'&hd=1',{mode:'cors'});if(!res.ok)throw Error('API');
  const json=await res.json();const d=json?.data||json?.result||json;if(json.code!==0&&!json.data)throw Error(json.msg||'No data');
  const raw=d.images||d.image_post_info||d.photo_images||d.photos||[];photos=raw.map(x=>typeof x==='string'?x:pick(x,'url','image','src')).filter(Boolean);
  if(!photos.length)throw Error('NO_PHOTOS');
  const author=d.author||d.authorInfo?.user||{};const name=pick(author,'nickname','unique_id','uniqueId','name')||'TikTok';
  const avatar=pick(author,'avatar','avatarThumb','avatarMedium','avatar_larger');
  $('empty').classList.add('hidden');$('profile').innerHTML=(avatar?'<img src="'+esc(avatar)+'" class="w-10 h-10 rounded-full object-cover border border-white/10">':'<div class="w-10 h-10 rounded-full bg-[#121215] border border-white/10 flex items-center justify-center"><i class="fa-brands fa-tiktok"></i></div>')+'<div><div class="text-xs font-bold text-white">'+esc(name)+'</div><div class="text-[10px] text-gray-500">'+photos.length+' photos</div></div>';
  $('photoGrid').innerHTML=photos.map((p,i)=>'<button onclick="openAd('+i+')" class="wallzy-card relative rounded-3xl overflow-hidden aspect-[9/16] shadow-sm border border-white/5 bg-[#0a0a0c]"><div class="absolute inset-0 skeleton"></div><img src="'+esc(p)+'" class="w-full h-full object-cover relative z-10 transition-opacity duration-500" loading="lazy" onload="this.previousElementSibling.remove()"></button>').join('');
  $('result').classList.remove('hidden');$('empty').classList.add('hidden');$('status').textContent='';const S='<scr'+'ipt>';const E='</scr'+'ipt>';loadAd('topAdSlot','320px','50px',S+"atOptions={key:'88d5e46388eccb148b6b930738790b86',format:'iframe',height:50,width:320,params:{}};"+E+S+'src="https://www.highrevenueformat.com/88d5e46388eccb148b6b930738790b86/invoke.js"'+E);loadAd('gridAdSlot','300px','250px',S+'async="async" data-cfasync="false" src="https://pl31436544.profitableratecpmnetwork.com/66531d847e0e04e4e76d697b014ef012/invoke.js"'+E+'<div id="container-66531d847e0e04e4e76d697b014ef012"></div>');
 }catch(e){console.error(e);$('empty').classList.add('hidden');$('emptyState').classList.remove('hidden');$('status').textContent='';showToast(e.message==='NO_PHOTOS'?'Link này không phải TikTok Photo.':'Không lấy được ảnh. Hãy thử lại.')}
 finally{$('get').disabled=false}
}
function openAd(i){pending=i;$('downloadAdModal').classList.remove('hidden');$('skip').classList.add('hidden');ready=false;let s=5;$('countdown').textContent='5s';$('waiting').textContent='Please wait...';if(timer)clearInterval(timer);const S='<scr'+'ipt>';const E='</scr'+'ipt>';loadAd('adModalSlot','300px','250px',S+"atOptions={key:'e58f8e3626088fa32b2d126d4bdbe104',format:'iframe',height:250,width:300,params:{}};"+E+S+'src="https://www.highrevenueformat.com/e58f8e3626088fa32b2d126d4bdbe104/invoke.js"'+E);timer=setInterval(()=>{s--;if(s>0){$('countdown').textContent=s+'s'}else{clearInterval(timer);timer=null;ready=true;$('countdown').textContent='✓';$('waiting').textContent='You can continue';$('skip').classList.remove('hidden')}},1000)}
$('skip').onclick=()=>{if(!ready)return;ready=false;$('downloadAdModal').classList.add('hidden');downloadPhoto(pending)}
async function downloadPhoto(i){const u=photos[i];if(!u)return;try{const res=await fetch(u,{mode:'cors',cache:'no-store'});if(!res.ok)throw Error();const blob=await res.blob();const ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='wallzy-tiktok-'+(i+1)+'.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);showToast('Ảnh đã được tải xuống')}catch(e){window.open(u,'_blank','noopener')}}
$('downloadAll').onclick=async()=>{if(!photos.length)return;pending=0;openAd(0);const old=$('skip').onclick;$('skip').onclick=async()=>{if(!ready)return;ready=false;$('downloadAdModal').classList.add('hidden');for(let i=0;i<photos.length;i++){await downloadPhoto(i);await new Promise(r=>setTimeout(r,150))}}};
$('get').onclick=getPhotos;$('url').addEventListener('keydown',e=>{if(e.key==='Enter')getPhotos()});
</script>
</body>
</html>
