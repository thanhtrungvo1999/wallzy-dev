<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080a">
  <title>404 - Page Not Found | Wallzy</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#08080a;color:#fff}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    .wrap{width:100%;max-width:390px}
    .icon{width:82px;height:82px;margin:0 auto 28px;border-radius:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:30px}
    .code{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:700;margin-bottom:10px}
    h1{margin:0;font-size:28px;letter-spacing:-.03em}
    p{margin:12px auto 28px;max-width:310px;color:rgba(255,255,255,.45);font-size:14px;line-height:1.6}
    a{display:flex;align-items:center;justify-content:center;width:100%;padding:14px 18px;border-radius:16px;background:#fff;color:#000;text-decoration:none;font-weight:700;font-size:14px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="icon">↗</div>
    <div class="code">Error 404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or may have been removed.</p>
    <a href="/">Back to Wallzy</a>
  </main>
</body>
</html>
